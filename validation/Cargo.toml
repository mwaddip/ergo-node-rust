[package]
name = "ergo-validation"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Block validation for the Ergo Rust node"

[features]
# Opt-in JSON (de)serialization for sigma types — OFF by default, so the
# node build is unchanged (the node never needs serde on these types).
# External consumers (e.g. the SANTA donner-runner) enable it for serde on
# enr-exposed types; cargo feature-unification then also turns on
# ergo-chain-types/json, giving enr_chain::Header its Deserialize impl.
json = ["ergo-lib/json", "ergo-chain-types/json"]

[dependencies]
ergo-lib = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
ergo-chain-types = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
ergo-nipopow = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
sigma-ser = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
ergo_avltree_rust = "0.1.1"
# The tree-version rules for a block's transactions (facts/chain.md § "The
# tree version a block's transactions are read at"): stated once, there.
enr-chain = { path = "../chain" }
enr-state = { path = "../state" }
rayon = "1"
blake2 = "0.10"
bytes = "1"
hex = "0.4"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
ergotree-interpreter = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
ergotree-ir = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "4e1d0f44" }
tempfile = "3"
# `no-env-filter` is required, not cosmetic: without it the default filter
# drops the emits under test and a "and warns" assertion silently passes on
# an empty buffer.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
