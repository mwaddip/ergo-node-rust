[workspace]
members = [".", "sync", "validation", "state", "mempool", "api", "mining", "p2p", "chain", "store"]
exclude = ["addons/fastsync", "addons/indexer"]

[package]
name = "ergo-node-rust"
version = "0.7.10"
edition = "2021"
license = "MIT"
description = "Full Ergo blockchain node in Rust"

[features]
default = ["jemalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Enables jemalloc's built-in heap profiler. Opt-in build
# (`--no-default-features --features jemalloc-prof`) for field
# profiling with jeprof. Activate at runtime via
# `_RJEM_MALLOC_CONF=prof:true,prof_prefix:/var/log/.../jeprof,...`.
jemalloc-prof = ["jemalloc", "tikv-jemallocator/profiling"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }
enr-chain = { path = "chain" }
enr-p2p = { path = "p2p" }
enr-state = { path = "state" }
enr-store = { path = "store" }
ergo-api = { path = "api" }
ergo-sync = { path = "sync" }
ergo_avltree_rust = "0.1.1"
ergo-chain-types = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-lib = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-mempool = { path = "mempool" }
ergo-mining = { path = "mining" }
ergo-validation = { path = "validation" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sigma-ser = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
toml = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru = "0.16"
anyhow = "1"
parking_lot = "0.12"
redb = "4"
thiserror = "2"

[dev-dependencies]
sigma-ser = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
serde_json = "1"
tempfile = "3"
k256 = { version = "0.13.1", features = ["arithmetic"] }
secp256k1 = "0.29"

# Route EVERY ergo_avltree_rust reference — our store/persistence deps AND
# sigma-rust's transitive dep in ergotree-interpreter (the consensus AvlTree
# script-op eval path) — to our fork. [patch] at the build root covers
# transitive deps, so interpreter and store both run the fork: one copy.
#
# Payoff: crates.io 0.1.1's AVL verifier PANICS on degenerate/malformed proofs
# (bad bytes, negative keyLength, wrong value length) — a crafted block's
# degenerate proof would panic block/digest validation instead of cleanly
# rejecting (consensus-robustness / DoS). The fork returns Err there; this puts
# Err-not-panic on the eval path, not just the store.
#
# PINNED BY REV, deliberately — the node ships release binaries, so the exact
# commit a build came from must be readable from the manifest, not only from
# Cargo.lock. This dependency is consensus-critical (the AVL prover/verifier
# decides AD-proof bytes and therefore block validity), so it moves only when
# someone bumps it and re-verifies. Branch-tracking was tried and reverted:
# `cargo update` for an unrelated reason would silently move a consensus dep.
#
# Asymmetry with SANTA's donner runner is intentional. `[patch]` applies ONLY
# from the top-level workspace root, so donner — which consumes our crates as
# path-deps — must restate this patch, and its rev then governs OUR crates too.
# donner MAY float on `main`: it is a grading harness, and floating keeps it
# from drifting behind (the two manifests had silently diverged 14 commits).
# The node does not float. When main advances, bump HERE deliberately.
#
# build-deb passes --locked so a stale or missing lockfile fails CI loudly
# rather than being silently regenerated.
#
# Single source of the fork reference: change HERE (members declare the plain
# "0.1.1"). Coordinate the bump with the sigma-rust session, which owns the fork.
[patch.crates-io]
ergo_avltree_rust = { git = "https://github.com/mwaddip/ergo_avltree_rust.git", rev = "d18773c" }
redb = { path = "patches/redb" }
