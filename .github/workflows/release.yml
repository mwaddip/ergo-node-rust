name: release

# Build a release on every pushed tag matching `v*`. Produces a stripped
# release binary, packages it as a Debian package and a portable tar.gz,
# and attaches both to a GitHub Release for the tag.

on:
  # Two ways in, and they must stay equivalent.
  push:
    tags:
      - 'v*'
  # Merging a release/* PR into main releases what was merged. The tag is
  # created by this workflow rather than by hand, so the tag and the merge
  # cannot disagree about what shipped.
  pull_request:
    types: [closed]

permissions:
  contents: write   # release + asset upload, and the tag push on the merge path

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    # A closed PR is not a merged one, and only release/* branches release.
    # Without this the job would run on every closed PR, including abandoned
    # ones.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          # On the merge path the PR ref is gone; take main, which now
          # contains the merge commit.
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          # Top-level submodules only — fetches chain, p2p, state, store,
          # facts but NOT their nested facts/ pointers. The nested
          # facts/ submodules are docs read by per-submodule Claude
          # sessions and are not part of the build inputs; one of them
          # (p2p/facts) currently points at a pruned commit, so
          # `recursive` would fail the checkout.
          submodules: true
          fetch-depth: 0

      # Resolves to the pushed tag on the tag path, or creates one from
      # Cargo.toml on the merge path. Everything downstream reads
      # steps.tag.outputs.name and does not care which path it came from.
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Read the literal out of [workspace.package] — the one place it
          # exists, since every member inherits it via version.workspace.
          # Scoped to the section rather than "first ^version line": that was
          # correct only by accident of section ordering, and this is the step
          # that decides what gets tagged.
          version=$(awk '
              /^\[workspace\.package\]/ { in_section = 1; next }
              /^\[/                     { in_section = 0 }
              in_section && /^version[[:space:]]*=/ {
                  match($0, /"[^"]*"/)
                  print substr($0, RSTART + 1, RLENGTH - 2)
                  exit
              }
          ' Cargo.toml)
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not read a version from [workspace.package] in Cargo.toml (got '${version}')"
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists — bump the workspace version before merging a release branch"
            exit 1
          fi
          # Annotated, with the CHANGELOG section as the message: the release
          # body is sourced from the annotation further down, and a lightweight
          # tag would leave it empty.
          #
          # Prefer the release's "### Release summary" subsection: one line per
          # change, no reasoning, which is what belongs on a release page. The
          # rest of the CHANGELOG entry is the durable record and reads as a
          # wall of text there.
          #
          # Falls back to the whole section when that subsection is absent, so
          # re-tagging any older release still produces the body it always did.
          section=$(awk -v v="## ${tag}" '$0 ~ "^" v {f=1; next} /^## v/ {f=0} f' CHANGELOG.md)
          notes=$(printf '%s\n' "$section" | awk '
              /^### Release summary/ { f=1; next }
              /^### / { f=0 }
              f
          ' | sed '/^$/d')
          [ -z "$notes" ] && notes="$section"
          [ -z "$notes" ] && notes="Release ${tag}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${notes}"
          git push origin "${tag}"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build .deb package
        run: ./build-deb

      - name: Build .tar.gz bundle
        run: ./build-tar

      - name: Build addon tar.gz bundles
        run: ./build-addons-tar

      - name: Build addon .deb packages
        run: ./build-addons-deb

      - name: Collect artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          deb=$(ls target/ergo-node-rust_*.deb | head -1)
          tar=$(ls target/ergo-node-rust-*.tar.gz | head -1)
          indexer_tar=$(ls target/ergo-indexer-*.tar.gz | head -1)
          fastsync_tar=$(ls target/ergo-fastsync-*.tar.gz | head -1)
          indexer_deb=$(ls target/ergo-indexer_*.deb | head -1)
          fastsync_deb=$(ls target/ergo-fastsync_*.deb | head -1)
          echo "deb=${deb}" >> "$GITHUB_OUTPUT"
          echo "tar=${tar}" >> "$GITHUB_OUTPUT"
          echo "indexer_tar=${indexer_tar}" >> "$GITHUB_OUTPUT"
          echo "fastsync_tar=${fastsync_tar}" >> "$GITHUB_OUTPUT"
          echo "indexer_deb=${indexer_deb}" >> "$GITHUB_OUTPUT"
          echo "fastsync_deb=${fastsync_deb}" >> "$GITHUB_OUTPUT"
          ls -lh "${deb}" "${tar}" "${indexer_tar}" "${fastsync_tar}" "${indexer_deb}" "${fastsync_deb}"

      - name: Extract tag annotation
        id: tagbody
        run: |
          # Pipe the annotated tag's message into $GITHUB_OUTPUT as a
          # multi-line value. `generate_release_notes: true` alone only
          # emits the auto-changelog link when commits land directly on
          # main (no PRs to summarize), which leaves the release body
          # empty. Sourcing from the tag annotation guarantees substance.
          #
          # actions/checkout on a tag-push trigger sometimes lands the
          # ref as a lightweight tag, in which case `%(contents)` falls
          # back to the commit message. Re-fetch tags explicitly so the
          # annotated object is present locally.
          git fetch --tags --force
          {
            echo 'body<<EOF_TAG_BODY'
            git tag -l --format='%(contents)' "${{ steps.tag.outputs.name }}"
            echo 'EOF_TAG_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.tar }}
            ${{ steps.artifacts.outputs.indexer_tar }}
            ${{ steps.artifacts.outputs.fastsync_tar }}
            ${{ steps.artifacts.outputs.indexer_deb }}
            ${{ steps.artifacts.outputs.fastsync_deb }}
          body: ${{ steps.tagbody.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
