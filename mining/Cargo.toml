[package]
name = "ergo-mining"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Block candidate assembly and PoW solution validation for external miners"

[dependencies]
ergo-lib = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-chain-types = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-nipopow = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-merkle-tree = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
# pow_target(n_bits) — the single sanctioned definition of the Autolykos
# mining target served as WorkMessage.b. This crate re-derived it from
# decode_compact_bits until v0.8.0 and stopped one division short, which is
# how it came to serve the difficulty. No cycle: chain/ has no in-repo path
# dependencies. BigInt is re-exported from the crate root.
enr-chain = { path = "../chain" }
ergo-validation = { path = "../validation" }
sigma-ser = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
blake2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# raw_value: lets WorkMessage emit `b` as a bare arbitrary-precision JSON
# number (the secp256k1-order target does not fit serde's numeric model).
# JSON shaping normally belongs to the api crate, but the wire bytes are
# produced by mining's own Serialize impl, so the escape hatch lives here.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
num-bigint = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
